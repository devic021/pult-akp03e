# akp03-deck configuration.
#
#   keys      the keys with displays. More than six is fine: they are shown a
#             page at a time, and the small left knob turns the page.
#   buttons   the three round keys below the displays
#   encoders  the three knobs: 0 is the small left one, 1 the big one on top,
#             2 the small right one
#
# The knobs do the same thing in every scene, so the muscle memory carries:
#   knob 0  page through the scene, press to go back to page one
#   knob 1  whatever that app's main dial should be
#   knob 2  output volume, press to mute
#
# Edits are picked up while the daemon runs; a file that fails to parse is
# reported and the running configuration is kept.
#
# A key carries at most one action:
#   run      = "shell command"     runs it detached
#   shortcut = "cmd+shift+4"       sends a keystroke (needs Accessibility)
#   volume   = -5                  changes output volume by that much
#   scene    = "other"             switches scene by hand
#   page     = "next"|"prev"|"first"
#
# ...and is drawn from:
#   label       text, shrunk and wrapped to fit
#   icon        a bundled icon's name, or a path to an SVG or image
#   color       background, #RGB or #RRGGBB
#   icon_color  defaults to the label colour
#   animate     "pulse" (breathes), "spin" (turns), "blink" (flashes)
#
# Find an app's bundle ID with:  lsappinfo info -only bundleid "$(lsappinfo front)"

brightness = 70
poll_ms = 300
press_feedback = true
default = "general"

# ---------------------------------------------------------------- general ----
# Shown whenever no other scene claims the frontmost app.
[scenes.general]

keys = [
  { icon = "folder",      label = "Finder",  color = "#1f6feb", run = "open -a Finder" },
  { icon = "terminal",    label = "iTerm",   color = "#30363d", run = "open -a iTerm" },
  { icon = "globe",       label = "Chrome",  color = "#d93025", run = "open -a 'Google Chrome'" },
  { icon = "layout-grid", label = "Spaces",  color = "#9a6700", shortcut = "ctrl+up" },
  { icon = "camera",      label = "Shot",    color = "#1a7f37", shortcut = "cmd+shift+4" },
  { icon = "moon",        label = "Sleep",   color = "#6e40c9", run = "pmset displaysleepnow" },

  { icon = "message-square", label = "Teams",  color = "#4b53bc", run = "open -a 'Microsoft Teams'" },
  { icon = "hash",        label = "Slack",   color = "#611f69", run = "open -a Slack" },
  { icon = "inbox",       label = "Mail",    color = "#1f6feb", run = "open -a Mail" },
  { icon = "calendar-days", label = "Cal",   color = "#d93025", run = "open -a Calendar" },
  { icon = "shield",      label = "VPN",     color = "#30363d", run = "open -a ProtonVPN" },
  { icon = "lock",        label = "Lock",    color = "#6e40c9", shortcut = "ctrl+cmd+q" },
]

buttons = [
  { scene = "general" },
  { shortcut = "cmd+shift+4" },
  { shortcut = "ctrl+up" },
]

encoders = [
  { cw = { page = "next" }, ccw = { page = "prev" }, press = { page = "first" } },
  { cw = { shortcut = "ctrl+right" }, ccw = { shortcut = "ctrl+left" } },
  { cw = { volume = 5 }, ccw = { volume = -5 }, press = { shortcut = "f8" } },
]

