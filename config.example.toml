  { icon = "sun",           label = "Day",    color = "#30363d", shortcut = "cmd+1" },
  { icon = "columns-2",     label = "Week",   color = "#30363d", shortcut = "cmd+2" },
  { icon = "calendar-days", label = "Month",  color = "#30363d", shortcut = "cmd+3" },
  { icon = "layout-grid",   label = "Year",   color = "#30363d", shortcut = "cmd+4" },
]

buttons = [
  { scene = "Početna" },
  { shortcut = "cmd+shift+4" },
  { shortcut = "ctrl+up" },
]

encoders = [
  { cw = { page = "next" }, ccw = { page = "prev" }, press = { page = "first" } },
  { cw = { shortcut = "cmd+right" }, ccw = { shortcut = "cmd+left" } },
  { cw = { volume = 5 }, ccw = { volume = -5 }, press = { mute = "toggle" } },
]

# ------------------------------------------------------------- Luminar Neo ---
# Only the shortcuts macOS apps share; Luminar's own tool keys differ by
# version, so add them yourself once you know which you want.
[scenes.luminar]
apps = ["com.skylum.luminarneo"]

keys = [
  { icon = "undo-2",  label = "Undo",   color = "#9a6700", shortcut = "cmd+z" },
  { icon = "repeat",  label = "Redo",   color = "#9a6700", shortcut = "cmd+shift+z" },
  { icon = "save",    label = "Save",   color = "#1a7f37", shortcut = "cmd+s" },
  { icon = "upload",  label = "Export", color = "#6e40c9", shortcut = "cmd+shift+e" },
  { icon = "copy",    label = "Copy",   color = "#30363d", shortcut = "cmd+c" },
  { icon = "layout-grid", label = "General", color = "#1f6feb", scene = "Početna" },
]

buttons = [
  { scene = "Početna" },
  { shortcut = "cmd+shift+4" },
  { shortcut = "ctrl+up" },
]

encoders = [
  { cw = { page = "next" }, ccw = { page = "prev" }, press = { page = "first" } },
  { cw = { shortcut = "cmd+=" }, ccw = { shortcut = "cmd+-" } },
  { cw = { volume = 5 }, ccw = { volume = -5 }, press = { mute = "toggle" } },
]

# ======================================================================= platno
# A scene can paint across the whole dock instead of six separate keys. The
# seams are real, about a quarter of a key of plastic between each screen, so
# these are sweeps, waves and fills, never text or photographs: a letter cut by
# the bezel is a letter gone.
#
# `effect` chooses the motion; the geometry follows it unless `mapping` says
# otherwise. `physical` keeps shapes true across the gaps, `packed` keeps a
# travelling front at constant speed.
#
# The keys keep whatever they are bound to: a canvas replaces the picture, not
# the press. Button 1 is left on "back to Početna" so a canvas scene can always
# be left, nothing on screen says what the keys do.

[scenes.prelet]
buttons = [ { scene = "Početna" }, { shortcut = "cmd+shift+4" }, { shortcut = "ctrl+up" } ]
encoders = [
  { cw = { page = "next" }, ccw = { page = "prev" } },
  { cw = { scene = "talas" }, ccw = { scene = "dah" } },
  { cw = { volume = 5 }, ccw = { volume = -5 }, press = { mute = "toggle" } },
]
[scenes.prelet.surface]
kind = "canvas"
effect = "sweep"
color = "#ffffff"
background = "#06070a"
shear = 0.25              # its own: tilts the bar into a diagonal wipe

[scenes.talas]
buttons = [ { scene = "Početna" }, { shortcut = "cmd+shift+4" }, { shortcut = "ctrl+up" } ]
[scenes.talas.surface]
kind = "canvas"
effect = "wave"
color = "#4da3ff"
background = "#070a10"
fill = 0.45               # its own: liquid in a tank instead of a bare line

[scenes.puls]
buttons = [ { scene = "Početna" }, { shortcut = "cmd+shift+4" }, { shortcut = "ctrl+up" } ]
encoders = [ {}, {}, { cw = { volume = 5 }, ccw = { volume = -5 }, press = { mute = "toggle" } } ]

[scenes.puls.surface]
kind = "canvas"
effect = "pulse"
color = "#c3a2ff"
background = "#08070f"
origin = [0.5, 0.5]       # its own: rings are born in the middle of the seam,
                          # so they appear already sixteen pixels across

[scenes.kisa]
buttons = [ { scene = "Početna" }, { shortcut = "cmd+shift+4" }, { shortcut = "ctrl+up" } ]
encoders = [ {}, {}, { cw = { volume = 5 }, ccw = { volume = -5 }, press = { mute = "toggle" } } ]

[scenes.kisa.surface]
kind = "canvas"
effect = "rain"
color = "#32d074"
background = "#060a07"
wind = 0.25               # its own: sideways drift. Past about 0.4 add
                          # mapping = "physical", or the slant kinks at a seam

[scenes.zora]
buttons = [ { scene = "Početna" }, { shortcut = "cmd+shift+4" }, { shortcut = "ctrl+up" } ]
encoders = [ {}, {}, { cw = { volume = 5 }, ccw = { volume = -5 }, press = { mute = "toggle" } } ]

[scenes.zora.surface]
kind = "canvas"
effect = "aurora"
color = "#ff8a3d"
color2 = "#ffe3b0"
background = "#0b0608"
bands = 4                 # its own: 0 a smooth field, 3-5 soft curtains
color_cycle = 600         # ten minutes for one drift, so it is a different
                          # colour every time you happen to glance at it

[scenes.orbita]
buttons = [ { scene = "Početna" }, { shortcut = "cmd+shift+4" }, { shortcut = "ctrl+up" } ]
[scenes.orbita.surface]
kind = "canvas"
effect = "orbit"
color = "#4da3ff"
background = "#06070a"
lobes = [3, 2]            # its own: 1,1 an ellipse; 3,2 a knot; 2,1 a figure
                          # of eight
trail = 0.45              # its own: seconds of the past still drawn. This is
                          # what carries the head across sixteen pixels of
                          # plastic, at 0 it crosses invisibly

[scenes.skok]
buttons = [ { scene = "Početna" }, { shortcut = "cmd+shift+4" }, { shortcut = "ctrl+up" } ]
[scenes.skok.surface]
kind = "canvas"
effect = "warp"
color = "#9fd0ff"
background = "#04050a"
exponent = 2.8            # its own: 1 a drift, 2.4 perspective, 4 a violent
                          # jump to light speed
density = 1.6             # more stars; the count knob is shared by all ten

[scenes.lava]
buttons = [ { scene = "Početna" }, { shortcut = "cmd+shift+4" }, { shortcut = "ctrl+up" } ]
[scenes.lava.surface]
kind = "canvas"
effect = "lava"
color = "#ff5a2d"
color2 = "#ffd27a"
background = "#0a0604"
threshold = 1.0           # its own: 1.0 is a blob that ends at its own radius.
                          # Lower and it reaches further and everything merges
speed = 0.6               # slower than life, which is the whole point of it

[scenes.vatra]
buttons = [ { scene = "Početna" }, { shortcut = "cmd+shift+4" }, { shortcut = "ctrl+up" } ]
[scenes.vatra.surface]
kind = "canvas"
effect = "ember"
color = "#ff7a18"
color2 = "#fff0c0"
background = "#080402"
height = 0.8              # its own: how far up the dock the flame reaches
smoke = 0.35              # its own: dissolve the tip into the background

[scenes.dah]
buttons = [ { scene = "Početna" }, { shortcut = "cmd+shift+4" }, { shortcut = "ctrl+up" } ]
[scenes.dah.surface]
kind = "canvas"
effect = "breathe"
color = "#2d6fff"
background = "#04050a"
shape = "heartbeat"       # its own: sine | ease | heartbeat
floor = 0.08              # its own: the level at the bottom of a breath. Keep
                          # it above zero so the dock never looks switched off

# ==================================================================== vrednosti
# A key can show a number that comes from somewhere else. A `[feeds.NAME]`
# block says where to get it; a key's `value` and `caption` are templates that
# read it back:
#
#   value = "{vreme.temp|round}°"      feed name, field name, formatter
#
# Formatters, chosen by what fits a key, 54 px of usable width holds three
# comfortable glyphs at 34 px and five at 22, never six, which is why a `%`
# belongs in the caption and not on the number:
#
#   round round1 frac2 int      decimals
#   signed signed1             keeps the + that makes a change a change
#   k bytes                    1200 -> 1.2k, 1536 -> 1.5K
#   dur until clock age        spans and times: 2h14, 47m, 15:21, 18m
#   clip:N                     cuts a word to N characters
#   compass16                  a bearing snapped to sixteen points
#   wmo                        a weather code as an icon's name
#
# A missing value is an em dash, never a zero. A feed past its `stale_after`
# keeps its last number, dimmed, with the caption replaced by how old it is:
# an old temperature is still information, a blank key is not.
#
# `cycle` is the other things a key can show; pressing it moves to the next and
# repaints that one key. `ramp` makes the background itself a reading. A knob
# bound to `hour` moves the whole scene through the forecast and snaps back to
# now after twenty seconds, so a dock left three hours ahead cannot quietly
# show the wrong weather.
#
# Both hosts below are open-meteo: no key, no account, about 2.5 KB a poll.
# They need to know where you are, and that does not go in this file, the app
# round-trips it, copies it to .bak on every save and people paste it into bug
# reports. Put your coordinates in a file of their own instead:
#
#   ~/Library/Application Support/Pult/place.toml
#   lat = 45.2671
#   lon = 19.8335
#
# Without it the feeds say so at startup and the keys show em dashes.

[feeds.vreme]
kind = "http"
url = "https://api.open-meteo.com/v1/forecast?latitude={lat}&longitude={lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,is_day&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,precipitation_probability,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m&forecast_hours=24&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto"
every = "15m"
stale_after = "2h"
# A 200 that quietly omits this is a failure, not data: without it a host that
# drops the field would leave the last temperature looking current all day.
require = ["/current/temperature_2m"]

[feeds.vreme.map]
temp    = "/current/temperature_2m"
feels   = "/current/apparent_temperature"
hum     = "/current/relative_humidity_2m"
code    = "/current/weather_code"
wind    = "/current/wind_speed_10m"
gust    = "/current/wind_gusts_10m"
bearing = "/current/wind_direction_10m"
rain    = "/hourly/precipitation_probability/0"
hi      = "/daily/temperature_2m_max/0"
lo      = "/daily/temperature_2m_min/0"
# The next one that has not happened yet, not today's: after sunset the
# first would be a time in the past, and the key would show nothing all
# evening, which is exactly when somebody looks at it.
sunrise = "future:/daily/sunrise"
sunset  = "future:/daily/sunset"
# Windows, which say their own width in the caption and so do not scrub: the
# worst it gets in the next six hours, and how much falls in them.
rain6   = "max:/hourly/precipitation_probability[0:6]"
mm6     = "sum:/hourly/precipitation[0:6]"

# A series carries its own axis, so the knob reads the hour the host named
# rather than counting array slots, which is an hour wrong twice a year.
# `for` names the scalar it stands in for, so `{vreme.temp}` scrubs by itself.
#
# Every reading on the page has one. A single key moving while the other five
# stay on the present hour is six numbers that do not belong to each other.
temp_h    = { series = "/hourly/temperature_2m",        axis = "/hourly/time", for = "temp" }
feels_h   = { series = "/hourly/apparent_temperature",  axis = "/hourly/time", for = "feels" }
hum_h     = { series = "/hourly/relative_humidity_2m",  axis = "/hourly/time", for = "hum" }
code_h    = { series = "/hourly/weather_code",          axis = "/hourly/time", for = "code" }
wind_h    = { series = "/hourly/wind_speed_10m",        axis = "/hourly/time", for = "wind" }
gust_h    = { series = "/hourly/wind_gusts_10m",        axis = "/hourly/time", for = "gust" }
bearing_h = { series = "/hourly/wind_direction_10m",    axis = "/hourly/time", for = "bearing" }
rain_h    = { series = "/hourly/precipitation_probability", axis = "/hourly/time", for = "rain" }

[feeds.vazduh]
kind = "http"
url = "https://air-quality-api.open-meteo.com/v1/air-quality?latitude={lat}&longitude={lon}&current=european_aqi,pm2_5,pm10,uv_index"
every = "30m"
stale_after = "3h"
map = { aqi = "/current/european_aqi", pm25 = "/current/pm2_5", pm10 = "/current/pm10", uv = "/current/uv_index" }

# ------------------------------------------------------------------- vreme ---
# Six readings, each with more behind it than it shows. Reach it with
# `scene = "vreme"` on any key, or from a knob.
[scenes.Vreme]

keys = [
  # The background is the temperature as much as the number is.
  { value = "{vreme.temp|round}°", caption = "oseća {vreme.feels|round}°",
    ramp = { field = "vreme.temp", stops = [[-5, "#1f6feb"], [10, "#1a7f37"], [24, "#9a6700"], [34, "#d93025"]] },
    cycle = [
      { value = "{vreme.feels|round}°", caption = "oseća se" },
      { value = "{vreme.hum|round}", caption = "% vlage" },
      { value = "{vreme.hi|round}/{vreme.lo|round}", caption = "danas" },
    ] },

  { value = "{vreme.rain|round}", caption = "% kiše", icon = "umbrella", color = "#1f6feb",
    cycle = [
      { value = "{vreme.rain6|round}", caption = "najviše 6h", icon = "umbrella" },
      { value = "{vreme.mm6|round1}", caption = "mm / 6h", icon = "droplets" },
    ] },

  # The arrow points where the wind is going, quantised to sixteen points so
  # the rotated-icon cache stays at sixteen entries.
  { value = "{vreme.wind|round}", caption = "km/h", color = "#30363d",
    icon = "navigation", icon_rotate = "{vreme.bearing|compass16}",
    cycle = [
      { value = "{vreme.gust|round}", caption = "u udaru", icon = "wind" },
    ] },

  # No number at all: the sky is a glyph, with today's range under it.
  { icon = "{vreme.code|wmo}", label = "{vreme.hi|round}/{vreme.lo|round}", color = "#0d1117" },

  { value = "{vreme.sunset|until}", caption = "do zalaska", icon = "sunset", color = "#6e40c9",
    cycle = [
      { value = "{vreme.sunset|clock}", caption = "zalazak", icon = "sunset" },
      { value = "{vreme.sunrise|until}", caption = "do izlaska", icon = "sunrise" },
      { value = "{vreme.sunrise|clock}", caption = "izlazak", icon = "sunrise" },
    ] },

  { value = "{vazduh.aqi|round}", caption = "vazduh",
    ramp = { field = "vazduh.aqi", stops = [[20, "#1a7f37"], [40, "#9a6700"], [60, "#d93025"], [100, "#6e40c9"]] },
    cycle = [
      { value = "{vazduh.pm25|round1}", caption = "PM2.5" },
      { value = "{vazduh.pm10|round}", caption = "PM10" },
      { value = "{vazduh.uv|round1}", caption = "UV", icon = "sun" },
    ] },
]

buttons = [
  { scene = "Početna" },
  { shortcut = "cmd+shift+4" },
  { shortcut = "ctrl+up" },
]

encoders = [
  { cw = { page = "next" }, ccw = { page = "prev" }, press = { page = "first" } },
  # The big knob walks the forecast. It comes back to now on its own.
  { cw = { hour = "next" }, ccw = { hour = "prev" }, press = { hour = "now" } },
  { cw = { volume = 5 }, ccw = { volume = -5 }, press = { mute = "toggle" } },
]

# ================================================================== mirovanje
# When nobody has touched the Mac for a while the dock stops being a controller
# and becomes something to look at. Any scene will do; a canvas is the point.
#
# Waking is a keystroke, a mouse move or a press on the dock itself, the dock
# is a vendor HID device, not a keyboard, so macOS never sees its presses and
# the daemon folds them in on its own. The waking press is swallowed, because
# slapping a key to wake the dock should not also fire what that key does.
#
# The dock keeps going when the Mac's display sleeps; set
# dark_when_display_sleeps = true if you would rather it went dark with the
# screen. Full system sleep is another matter: the daemon is suspended along
# with everything else, so the dock holds its last frame until the Mac wakes.

[idle]
after = "3m"
scene = "zora"

# Or a playlist, which wins over `scene`. Each member is a whole scene, so
# every one keeps its own effect, colours, geometry and frame rate, and each
# can be judged on its own before it goes in here.
scenes = ["zora", "lava", "vatra", "dah"]
hold = "5m"            # how long each member runs
fade = 2.5             # seconds of cross-dissolve between them. A hard cut in
                       # the corner of your eye reads as a fault, so not 0
fade_in = 1.5          # seconds to come up from nothing when it starts, so it
                       # arrives instead of appearing
wake_on = "any"        # any | dock. "dock" is what you want when you are
                       # reading a second screen and would rather it kept going

brightness = 35
dark_when_display_sleeps = false
swallow_first_press = true

# The frame the dock holds while the Mac sleeps. Nothing can animate then,
# the daemon is frozen with everything else, so this is one still picture,
# PNG or JPEG, spread across all six keys. Remove the line and the dock simply
# keeps whatever it was showing.
sleep_image = "~/.config/pult/sleep.png"

[scenes.moja]
buttons = [ { scene = "Početna" }, { shortcut = "cmd+shift+4" }, { shortcut = "ctrl+up" } ]
encoders = [ {}, {}, { cw = { volume = 5 }, ccw = { volume = -5 }, press = { mute = "toggle" } } ]

[scenes.moja.surface]
kind = "canvas"
source = "~/.config/pult/proba.gif"
mapping = "packed"

[scenes.uspravno]
buttons = [ { scene = "Početna" }, { shortcut = "cmd+shift+4" }, { shortcut = "ctrl+up" } ]
encoders = [ {}, {}, { cw = { volume = 5 }, ccw = { volume = -5 }, press = { mute = "toggle" } } ]

[scenes.uspravno.surface]
kind = "canvas"
source = "~/.config/pult/uspravno.gif"

# ====================================================================== masina
# What this Mac is doing to itself. A `shell` feed: the helper beside the
# daemon prints one line of JSON and exits.
#
# Nothing here needs permission and nothing needs root. The thermal sensors in
# particular were worth measuring rather than assuming: `powermetrics` does
# need root, and the usual advice is to install a privileged helper for it, but
# on this hardware the sensors arrive as HID events any process can read. The
# calls that read them are not public API, which is exactly why they live in a
# separate short-lived process: if a future macOS moves them, the cost is one
# failed poll and a blank key, not a dock that stops answering.
#
# `{bin}` is where this copy of Pult lives, filled in by the daemon.

[feeds.masina]
kind = "shell"
run = "{bin}/vitals"
# Seconds, not minutes: this reads the machine it runs on, so it costs a
# couple of hundredths of a second of its own CPU and nobody else's network.
# The Sources pane offers one to thirty for a feed like this.
every = "5s"
stale_after = "2m"
require = ["/cpu/cores"]

[feeds.masina.map]
cpu       = "/cpu/busy"
load      = "/cpu/load"
per_core  = "/cpu/per_core"
cores     = "/cpu/cores"
temp      = "/temperature/soc"
temp_mean = "/temperature/soc_mean"
temp_batt = "/temperature/battery"
mem       = "/memory/used_percent"
mem_used  = "/memory/used_gb"
mem_free  = "/memory/free_gb"
batt      = "/battery/percent"
batt_min  = "/battery/minutes"
disk      = "/disk/free_gb"
disk_used = "/disk/used_percent"
uptime    = "/uptime/seconds"

# ------------------------------------------------------------------ masina ---
[scenes."Mašina"]

keys = [
  { value = "{masina.cpu|round}", caption = "% CPU", icon = "cpu",
    ramp = { field = "masina.cpu", stops = [[0, "#1a7f37"], [50, "#9a6700"], [85, "#d93025"]] },
    cycle = [
      { value = "{masina.load|round1}", caption = "opterećenje", icon = "activity" },
      { value = "{masina.cores|round}", caption = "jezgara", icon = "microchip" },
    ] },

  { value = "{masina.temp|round}°", caption = "SoC", icon = "thermometer",
    ramp = { field = "masina.temp", stops = [[30, "#1a7f37"], [60, "#9a6700"], [85, "#d93025"]] },
    cycle = [
      { value = "{masina.temp_mean|round}°", caption = "prosek jezgara" },
      { value = "{masina.temp_batt|round}°", caption = "baterija", icon = "battery" },
    ] },

  { value = "{masina.mem|round}", caption = "% RAM", icon = "memory-stick",
    ramp = { field = "masina.mem", stops = [[0, "#1a7f37"], [70, "#9a6700"], [90, "#d93025"]] },
    cycle = [
      { value = "{masina.mem_used|round}", caption = "GB u upotrebi" },
      { value = "{masina.mem_free|round}", caption = "GB slobodno" },
    ] },

  { value = "{masina.batt|round}", caption = "% baterije", icon = "battery",
    ramp = { field = "masina.batt", stops = [[10, "#d93025"], [30, "#9a6700"], [60, "#1a7f37"]] },
    cycle = [
      { value = "{masina.batt_min|dur}", caption = "preostalo", icon = "battery-charging" },
      { value = "{masina.temp_batt|round}°", caption = "temperatura" },
    ] },

  { value = "{masina.disk|round}", caption = "GB slobodno", icon = "hard-drive", color = "#30363d",
    cycle = [
      { value = "{masina.disk_used|round}", caption = "% zauzeto" },
    ] },

  { value = "{masina.uptime|dur}", caption = "radi", icon = "timer", color = "#6e40c9" },
]

buttons = [
  { scene = "Početna" },
  { shortcut = "cmd+shift+4" },
  { shortcut = "ctrl+up" },
]

encoders = [
  { cw = { page = "next" }, ccw = { page = "prev" }, press = { page = "first" } },
  # The big knob is left alone here. On the weather page it walks the
  # forecast; this page has no series to walk, and binding it to "switch to
  # another scene" means a page you are reading jumps away under an idle
  # hand, which also quietly defeats pinning.
  {},
  { cw = { volume = 5 }, ccw = { volume = -5 }, press = { mute = "toggle" } },
]
