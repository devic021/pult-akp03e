  { cw = { page = "next" }, ccw = { page = "prev" }, press = { page = "first" } },
  { cw = { shortcut = "cmd+right" }, ccw = { shortcut = "cmd+left" } },
  { cw = { volume = 5 }, ccw = { volume = -5 }, press = { shortcut = "f8" } },
]

# ------------------------------------------------------------- Luminar Neo ---
# Only the shortcuts macOS apps share; Luminar's own tool keys differ by
# version, so add them yourself once you know which you want.
[scenes.luminar]
apps = ["com.skylum.luminarneo"]

keys = [
  { icon = "undo-2",  label = "Undo",   color = "#9a6700", shortcut = "cmd+z" },
  { icon = "repeat",  label = "Redo",   color = "#9a6700", shortcut = "cmd+shift+z" },
  { icon = "save",    label = "Save",   color = "#1a7f37", shortcut = "cmd+s" },
  { icon = "upload",  label = "Export", color = "#6e40c9", shortcut = "cmd+shift+e" },
  { icon = "copy",    label = "Copy",   color = "#30363d", shortcut = "cmd+c" },
  { icon = "layout-grid", label = "General", color = "#1f6feb", scene = "general" },
]

buttons = [
  { scene = "general" },
  { shortcut = "cmd+shift+4" },
  { shortcut = "ctrl+up" },
]

encoders = [
  { cw = { page = "next" }, ccw = { page = "prev" }, press = { page = "first" } },
  { cw = { shortcut = "cmd+=" }, ccw = { shortcut = "cmd+-" } },
  { cw = { volume = 5 }, ccw = { volume = -5 }, press = { shortcut = "f8" } },
]

# ======================================================================= platno
# A scene can paint across the whole dock instead of six separate keys. The
# seams are real — about a quarter of a key of plastic between each screen — so
# these are sweeps, waves and fills, never text or photographs: a letter cut by
# the bezel is a letter gone.
#
# `effect` chooses the motion; the geometry follows it unless `mapping` says
# otherwise. `physical` keeps shapes true across the gaps, `packed` keeps a
# travelling front at constant speed.
#
# The keys keep whatever they are bound to: a canvas replaces the picture, not
# the press. Button 1 is left on "back to general" so a canvas scene can always
# be left — nothing on screen says what the keys do.

[scenes.talas]
buttons = [ { scene = "general" }, { shortcut = "cmd+shift+4" }, { shortcut = "ctrl+up" } ]
encoders = [
  { cw = { page = "next" }, ccw = { page = "prev" } },
  { cw = { scene = "puls" }, ccw = { scene = "kisa" } },
  { cw = { volume = 5 }, ccw = { volume = -5 }, press = { shortcut = "f8" } },
]
[scenes.talas.surface]
kind = "canvas"
effect = "wave"
color = "#4da3ff"
background = "#070a10"

[scenes.puls]
buttons = [ { scene = "general" }, { shortcut = "cmd+shift+4" }, { shortcut = "ctrl+up" } ]
[scenes.puls.surface]
kind = "canvas"
effect = "pulse"
color = "#c3a2ff"
background = "#08070f"

[scenes.kisa]
buttons = [ { scene = "general" }, { shortcut = "cmd+shift+4" }, { shortcut = "ctrl+up" } ]
[scenes.kisa.surface]
kind = "canvas"
effect = "rain"
color = "#32d074"
background = "#060a07"

[scenes.zora]
buttons = [ { scene = "general" }, { shortcut = "cmd+shift+4" }, { shortcut = "ctrl+up" } ]
[scenes.zora.surface]
kind = "canvas"
effect = "aurora"
color = "#ff8a3d"
background = "#0b0608"

[scenes.prelet]
buttons = [ { scene = "general" }, { shortcut = "cmd+shift+4" }, { shortcut = "ctrl+up" } ]
[scenes.prelet.surface]
kind = "canvas"
effect = "sweep"
color = "#ffffff"
background = "#06070a"

# ================================================================== mirovanje
# When nobody has touched the Mac for a while the dock stops being a controller
# and becomes something to look at. Any scene will do; a canvas is the point.
#
# Waking is a keystroke, a mouse move or a press on the dock itself — the dock
# is a vendor HID device, not a keyboard, so macOS never sees its presses and
# the daemon folds them in on its own. The waking press is swallowed, because
# slapping a key to wake the dock should not also fire what that key does.
#
# The dock keeps going when the Mac's display sleeps; set
# dark_when_display_sleeps = true if you would rather it went dark with the
# screen. Full system sleep is another matter: the daemon is suspended along
# with everything else, so the dock holds its last frame until the Mac wakes.

[idle]
after = "3m"
scene = "zora"
brightness = 35
dark_when_display_sleeps = false
swallow_first_press = true

# The frame the dock holds while the Mac sleeps. Nothing can animate then —
# the daemon is frozen with everything else — so this is one still picture,
# PNG or JPEG, spread across all six keys. Remove the line and the dock simply
# keeps whatever it was showing.
sleep_image = "~/.config/pult/sleep.png"

[scenes.moja]
buttons = [ { scene = "general" }, { shortcut = "cmd+shift+4" }, { shortcut = "ctrl+up" } ]
[scenes.moja.surface]
kind = "canvas"
source = "~/.config/pult/proba.gif"
mapping = "packed"

[scenes.uspravno]
buttons = [ { scene = "general" }, { shortcut = "cmd+shift+4" }, { shortcut = "ctrl+up" } ]
[scenes.uspravno.surface]
kind = "canvas"
source = "~/.config/pult/uspravno.gif"
