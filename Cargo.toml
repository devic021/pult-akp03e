[package]
name = "pult"
version = "0.4.1"
edition = "2021"
description = "Per-application scene switching for the Ajazz AKP03E stream dock on macOS"

[lib]
name = "pult"
path = "src/lib.rs"

[[bin]]
name = "pultd"
path = "src/main.rs"

[[bin]]
name = "vitals"
path = "src/bin/vitals.rs"

[dependencies]
ajazz-sdk = { path = "vendor/ajazz-sdk" }
hidapi = "2.6"
# gif and webp cost no new crates: resvg's raster-images feature already pins
# gif, image-webp and color_quant in the lock file. Turning them on lets a
# person bring their own animation.
image = { version = "0.25.5", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
] }
anyhow = "1"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
toml = "1.1.8"
ab_glyph = "0.2.32"
core-foundation = "0.10.1"
# Already in the lock file by way of hidapi; named here so the vitals helper
# can ask the kernel directly instead of spawning a process per reading.
libc = "0.2"
resvg = "0.48.1"
serde_json = "1.0.154"
base64 = "0.23.1"
